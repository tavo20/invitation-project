<script>
(function(){
  var ID = "02-dos-apps";
  var q = function(s){ return document.getElementById(ID + "-" + s); };
  var tl = gsap.timeline({ paused: true });

  // base-relative scales (shared device): 0.62 / 0.74
  var S = 0.62 / 0.74;
  var XL = 0.30 * 1080 - 540;   // -216
  var XR = 0.70 * 1080 - 540;   // +216
  var TILT = 18, OVER = 10, SLIDE = 420;

  // ── Scene 1 (0.0–1.4): cream ground, "InvitApp" settles down from above, letter stagger
  tl.fromTo(q("ring"), { opacity: 0, scale: 0.94 }, { opacity: 0.35, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
  tl.fromTo(q("glow-a"), { opacity: 0 }, { opacity: 1, duration: 1.2, ease: "sine.out" }, 0.2);
  tl.fromTo(q("glow-b"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo(q("dusk"), { opacity: 0 }, { opacity: 0, duration: 0.01 }, 0);
  tl.fromTo(q("title"), { y: -46 }, { y: 0, duration: 0.9, ease: "power3.out" }, 0.05);
  var chars = document.querySelectorAll("#" + CSS.escape(ID + "-title") + " ." + CSS.escape(ID + "-ch"));
  for (var i = 0; i < chars.length; i++) {
    tl.fromTo(chars[i], { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.08 + i * 0.055);
  }

  // ── Scene 2 (1.4–2.8): "el Álbum…" — left phone opens in from the left wing
  tl.fromTo(q("phone-l"),
    { x: XL - SLIDE, rotationY: TILT + OVER, scale: S * 0.88, opacity: 0 },
    { x: XL, rotationY: TILT, scale: S, opacity: 1, duration: 0.95, ease: "power3.out" }, 1.4);
  tl.fromTo(q("pill-l"), { scale: 0, opacity: 0, y: 16 },
    { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 1.95);

  // ── Scene 3 (2.8–4.0): "…y La Pista" — right phone from the right wing, its half dims
  tl.fromTo(q("phone-r"),
    { x: XR + SLIDE, rotationY: -TILT - OVER, scale: S * 0.88, opacity: 0 },
    { x: XR, rotationY: -TILT, scale: S, opacity: 1, duration: 0.95, ease: "power3.out" }, 2.8);
  tl.to(q("dusk"), { opacity: 1, duration: 0.8, ease: "sine.inOut" }, 2.85);
  tl.to(q("glow-b"), { opacity: 1, duration: 0.9, ease: "sine.out" }, 2.9);
  tl.fromTo(q("pill-r"), { scale: 0, opacity: 0, y: 16 },
    { scale: 1, opacity: 1, y: 0, duration: 0.55, ease: "back.out(1.6)" }, 3.3);
  tl.fromTo(q("plus"), { scale: 0, opacity: 0 },
    { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 3.5);

  // counter-phase idle (explicit tweens, no yoyo/repeat) — both return to 0
  tl.fromTo(q("float-l"), { y: 0 }, { y: -7, duration: 0.85, ease: "sine.inOut" }, 2.35);
  tl.to(q("float-l"), { y: 0, duration: 0.85, ease: "sine.inOut" }, 3.2);
  tl.fromTo(q("float-r"), { y: 0 }, { y: 7, duration: 0.5, ease: "sine.inOut" }, 3.75);
  tl.to(q("float-r"), { y: 0, duration: 0.5, ease: "sine.inOut" }, 4.25);

  // ── handoff_out (4.0–4.783): Álbum phone glides to center (x 50%, scale 0.74, rotY 0);
  //    La Pista phone leaves right with a fade; side chrome clears for frame 3.
  tl.to(q("phone-l"), { x: 0, scale: 1, rotationY: 0, duration: 0.783, ease: "power2.inOut" }, 4.0);
  tl.to(q("phone-r"), { x: XR + 260, opacity: 0, duration: 0.7, ease: "power2.in" }, 4.0);
  tl.to([q("pill-l"), q("pill-r"), q("plus")], { opacity: 0, duration: 0.35, ease: "power1.in" }, 4.0);
  tl.to([q("dusk"), q("glow-b")], { opacity: 0, duration: 0.7, ease: "sine.inOut" }, 4.0);
  tl.to(q("glow-a"), { x: 216, duration: 0.783, ease: "power2.inOut" }, 4.0);

  window.__timelines = window.__timelines || {};
  window.__timelines["02-dos-apps"] = tl;
})();
