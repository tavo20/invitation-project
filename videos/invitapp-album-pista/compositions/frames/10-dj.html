  <script>
  (function(){
    var root = document.querySelector('[data-composition-id="10-dj"]');
    var $ = function(id){ return root.querySelector('[id="' + id + '"]'); };
    var world = $("10-dj-world"), phone = $("10-dj-phone"), strip = $("10-dj-strip");
    var typed = $("10-dj-typed"), caret = $("10-dj-caret");
    var FULL = "invitapp.art/dj/boda-ana-pedro…";
    typed.textContent = "";

    var tl = gsap.timeline({ paused: true });
    gsap.set(world, { x: 0, y: 0, scale: 1, transformOrigin: "0 0" });

    // ---- Scene 1 (0.0–1.5): DJ phone slides in from the right with a tilt; headline + link pill types on
    tl.fromTo(phone, { x: 760, rotationY: -24, transformPerspective: 1600, opacity: 0 },
      { x: 0, rotationY: 0, transformPerspective: 1600, opacity: 1, duration: 0.85, ease: "power3.out" }, 0.0);
    tl.fromTo($("10-dj-head"), { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.15);
    tl.fromTo($("10-dj-pill"), { y: 24, scale: 0.92, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0.5);
    var tp = { n: 0 };
    tl.fromTo(tp, { n: 0 }, { n: FULL.length, duration: 0.75, ease: "none",
      onUpdate: function(){ typed.textContent = FULL.slice(0, Math.round(tp.n)); } }, 0.7);
    // caret blink after typing (explicit sets, no repeat)
    [1.6, 1.9, 2.2, 2.5].forEach(function(t){
      tl.set(caret, { opacity: 0 }, t);
      tl.set(caret, { opacity: 1 }, t + 0.15);
    });

    // ---- Scene 2 (1.5–3.3): camera travels down the list and pushes onto "quédate · pedida por Laura"
    tl.fromTo(strip, { y: 0 }, { y: -1337.1, duration: 0.95, ease: "power2.inOut" }, 1.5);
    tl.fromTo(world, { x: 0, y: 0, scale: 1 }, { x: -243, y: -576.5, scale: 1.45, duration: 0.75, ease: "power4.out" }, 1.95);
    tl.fromTo($("10-dj-scrim"), { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power1.out" }, 1.45);
    tl.fromTo($("10-dj-card-ring"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 2.35);

    function tap(id, t){
      var el = $(id), dot = el.children[0], ring = el.children[1];
      tl.fromTo(el, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t);
      tl.fromTo(dot, { scale: 1 }, { scale: 0.85, duration: 0.12, ease: "power2.out" }, t + 0.1);
      tl.to(dot, { scale: 1, duration: 0.14, ease: "power2.out" }, t + 0.22);
      tl.fromTo(ring, { scale: 1, opacity: 0.9 }, { scale: 2.3, opacity: 0, duration: 0.45, ease: "power2.out" }, t + 0.12);
      tl.to(el, { opacity: 0, duration: 0.2, ease: "power1.in" }, t + 0.42);
    }
    // tap "En cola"
    tap("10-dj-tap1", 2.55);
    tl.fromTo($("10-dj-encola-ring"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 2.62);
    tl.to($("10-dj-encola-ring"), { opacity: 0.35, duration: 0.3, ease: "power1.out" }, 2.95);
    // "Rechazar" and "Poner ahora" light up as they are named
    tl.fromTo($("10-dj-rech-ring"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 2.85);
    tl.fromTo($("10-dj-poner-ring"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 3.05);

    // ---- Scene 3 (3.3–4.97): press "Poner ahora" → screen swaps to SONANDO AHORA · quédate → pull back to base
    tap("10-dj-tap2", 3.35);
    tl.to($("10-dj-poner-ring"), { scale: 0.94, duration: 0.1, ease: "power2.in" }, 3.42);
    tl.to($("10-dj-poner-ring"), { scale: 1, duration: 0.2, ease: "back.out(3)" }, 3.52);
    tl.fromTo($("10-dj-d04"), { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out" }, 3.62);
    tl.to(world, { x: 0, y: 0, scale: 1, duration: 0.85, ease: "power3.inOut" }, 3.62);
    tl.to($("10-dj-scrim"), { opacity: 0, duration: 0.4, ease: "power1.out" }, 3.75);
    // the figures update
    tl.fromTo($("10-dj-np-ring"), { opacity: 0, scale: 1.04 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 4.3);
    tl.fromTo($("10-dj-st-pend"), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.5);
    tl.fromTo($("10-dj-st-son"), { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 4.6);
    // hold still to the end of the frame
    tl.to({}, { duration: 0.069 }, 4.9);

    window.__timelines = window.__timelines || {};
    window.__timelines["10-dj"] = tl;
  })();
  </script>
