  <script>
    (function () {
      var q = function (s) { return '[id="12-cierre-' + s + '"]'; };
      var tl = gsap.timeline({ paused: true });

      // Final geometry (relative to the shared base: center 540,820, scale 1 = storyboard "0.74")
      var S = 0.7;           // phones at 0.70x base -> 401 x 846, both fully inside 1080
      var DY = 155;          // phone centers at y 975
      var LX = -250;         // album center x 290
      var RX = 250;          // pista center x 790
      var TILT = 8;

      // ---- Scene 1 (0.0-1.8): background morphs to split, phones split-tilt into place ----
      tl.fromTo(q("cream"), { scaleX: 0 }, { scaleX: 1, duration: 1.05, ease: "power3.inOut" }, 0.1);
      tl.fromTo(q("ring"), { opacity: 0, scale: 0.92 }, { opacity: 0.3, scale: 1, duration: 1.2, ease: "power2.out" }, 0.5);
      tl.fromTo(q("seam"), { scaleY: 0, opacity: 0 }, { scaleY: 1, opacity: 1, duration: 0.8, ease: "power2.inOut" }, 0.75);

      // La Pista phone (handoff: x 50%, base scale) slides right and shrinks
      tl.fromTo(q("phone-pista"),
        { x: 0, y: 0, scale: 1, rotateY: 0 },
        { x: RX, y: DY, scale: S, rotateY: -TILT, duration: 1.1, ease: "power3.inOut" }, 0.05);
      // Album phone enters from the left with an overshoot tilt that settles
      tl.fromTo(q("phone-album"),
        { x: -980, y: DY, scale: S, rotateY: TILT + 14, opacity: 1 },
        { x: LX, y: DY, scale: S, rotateY: TILT, duration: 1.1, ease: "power3.out" }, 0.3);

      // counter-phase idle drift through the rest of the shot (single tweens, no repeat)
      tl.to(q("phone-album"), { y: DY - 10, duration: 3.0, ease: "sine.inOut" }, 1.4);
      tl.to(q("phone-pista"), { y: DY + 10, duration: 3.0, ease: "sine.inOut" }, 1.2);

      // ---- Scene 2 (1.8-3.6): "InvitApp" self-draws, tagline word stagger ----
      tl.fromTo(q("word"), { attr: { "stroke-dashoffset": 1600 } },
        { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power1.inOut" }, 1.75);
      tl.fromTo(q("word"), { attr: { "fill-opacity": 0 } },
        { attr: { "fill-opacity": 1 }, duration: 0.6, ease: "power2.out" }, 2.35);
      tl.fromTo(q("brand"), { y: 14 }, { y: 0, duration: 1.2, ease: "power2.out" }, 1.75);

      // the same word index in both colour layers animates together
      var inkWords = document.querySelectorAll('[class~="12-cierre-ink"] [class~="12-cierre-tw"]');
      var lightWords = document.querySelectorAll('[class~="12-cierre-light"] [class~="12-cierre-tw"]');
      for (var i = 0; i < inkWords.length; i++) {
        tl.fromTo([inkWords[i], lightWords[i]],
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 2.45 + i * 0.08);
      }

      // ---- Scene 3 (3.6-end): CTA pill pops (no bounce), URL settles, held read ----
      tl.fromTo(q("pill"), { opacity: 0, scale: 0.82, y: 16 },
        { opacity: 1, scale: 1, y: 0, duration: 0.42, ease: "power3.out" }, 3.55);
      tl.fromTo('[class~="12-cierre-url"]', { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 3.78);

      window.__timelines = window.__timelines || {};
      window.__timelines["12-cierre"] = tl;
    })();
  </script>
