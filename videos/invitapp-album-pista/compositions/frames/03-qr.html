    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      (function () {
        var DURATION = 3.994;
        var MAX_BLUR = 12;      // phone defocus (px)
        var DIM_LEVEL = 0.55;   // phone dim while card is focal
        var tl = gsap.timeline({ paused: true });

        // ---- base states (handoff_in: phone sharp, opacity 1, a01 visible) ----
        tl.set("#qr03-phone", { "--dof": "0px", opacity: 1 }, 0);
        tl.set("#qr03-shot-a", { y: 0, opacity: 1 }, 0);
        tl.set("#qr03-shot-b", { y: 300, opacity: 0 }, 0);
        tl.set("#qr03-wash", { scaleY: 0 }, 0);
        tl.set("#qr03-scan", { y: 0, opacity: 0 }, 0);
        tl.set(".qr03-corner", { opacity: 0, scale: 1.25 }, 0);
        tl.set("#qr03-headline", { opacity: 0, y: 30, scale: 0.86 }, 0);

        // ---- Scene 1 (0.0–1.6): card enters foreground, phone racks out of focus ----
        tl.to("#qr03-phone", { "--dof": MAX_BLUR + "px", opacity: DIM_LEVEL, duration: 0.6, ease: "power2.inOut" }, 0.05);
        tl.fromTo("#qr03-card",
          { x: -90, y: 280, rotation: -10, opacity: 0 },
          { x: 0, y: 0, rotation: -3, opacity: 1, duration: 0.7, ease: "power3.out" }, 0.08);

        // scan line + progress wipe across the QR
        tl.to("#qr03-scan", { opacity: 1, duration: 0.12, ease: "none" }, 0.7);
        tl.to("#qr03-scan", { y: 400, duration: 0.7, ease: "none" }, 0.7);
        tl.to("#qr03-wash", { scaleY: 1, duration: 0.7, ease: "none" }, 0.7);
        tl.to("#qr03-scan", { opacity: 0, duration: 0.15, ease: "power1.out" }, 1.38);
        tl.to(".qr03-corner", { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.32);

        // ---- Scene 2 (1.6–3.0): "y entran al álbum" — card slides away, phone refocuses ----
        tl.to("#qr03-card", { x: -760, y: 140, rotation: -14, opacity: 0, duration: 0.55, ease: "power2.in" }, 1.6);
        tl.to("#qr03-phone", { "--dof": "0px", opacity: 1, duration: 0.6, ease: "power2.inOut" }, 1.6);
        tl.to("#qr03-headline", { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.7)" }, 1.85);

        // ---- Scene 3 (3.0–4.0): grid scrolls inside the screen to a02, then settles ----
        tl.to("#qr03-shot-a", { y: -300, duration: 0.75, ease: "power2.inOut" }, 3.0);
        tl.to("#qr03-shot-a", { opacity: 0, duration: 0.45, ease: "power1.inOut" }, 3.15);
        tl.to("#qr03-shot-b", { y: 0, duration: 0.75, ease: "power2.inOut" }, 3.0);
        tl.to("#qr03-shot-b", { opacity: 1, duration: 0.45, ease: "power1.inOut" }, 3.1);

        // pad timeline to the frame duration
        tl.set({}, {}, DURATION);

        window.__timelines = window.__timelines || {};
        window.__timelines["03-qr"] = tl;
      })();
