  (function () {
    var ID = "01-hook";
    var DUR = 4.923;
    var $ = function (n) { return '#root [id="' + ID + "-" + n + '"]'; };
    var all = function (c) { return gsap.utils.toArray("#root .f01-hook-" + c); };

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // Ground: subtle camera push underneath the whole shot
    tl.fromTo($("stage"), { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);

    // geo-ring: faint, slow presence
    tl.fromTo($("ring"), { opacity: 0, scale: 0.94 }, { opacity: 0.4, scale: 1, duration: 1.4, ease: "power2.out" }, 0);
    tl.fromTo($("ring-inner"), { opacity: 0, scale: 0.9, rotation: -8 }, { opacity: 0.3, scale: 1, rotation: 0, duration: 1.6, ease: "power2.out" }, 0.1);
    tl.fromTo($("ring-inner"), { rotation: 0 }, { rotation: 10, duration: DUR - 1.7, ease: "none" }, 1.7);

    // Scene 1 (0.0–1.4s): "En tu boda" then per-word "todos quieren dos cosas"

      tl.fromTo(el, { opacity: 0, y: 18, filter: "blur(6px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.45, ease: "power3.out" }, 0.08 + i * 0.09);
    });
    all("s1").forEach(function (el, i) {
      tl.fromTo(el, { opacity: 0, y: 28, filter: "blur(10px)" },
        { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.5, ease: "power3.out" }, 0.48 + i * 0.13);

    // Scene 2 (1.4–2.6s): "las fotos…" + photo frame self-draw

      tl.fromTo(el, { opacity: 0, y: 40, scale: 0.96, filter: "blur(12px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 1.42 + i * 0.16);
    });
    tl.fromTo($("frame-front"), { strokeDasharray: 1, strokeDashoffset: 1 },
      { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 1.55);
    tl.fromTo($("frame-back"), { strokeDasharray: 1, strokeDashoffset: 1, opacity: 0 },
      { strokeDashoffset: 0, opacity: 1, duration: 0.85, ease: "power2.inOut" }, 1.75);

    // Scene 3 (2.6–4.0s): "…y su canción." italic + violet note pop (no bounce) + tiny jitter

    // subtle deterministic float/jitter — finite tweens, no repeat

    while (t + step <= DUR) {
      tl.to($("note"), {
        y: Math.sin(k * 1.7) * 4,
        x: Math.cos(k * 1.3) * 2,
        rotation: Math.sin(k * 1.1) * 2.5,
        duration: step,
        ease: "sine.inOut"

      t += step;
      k += 1;
