        ws.forEach(([, s], k) => tl.fromTo(`#cap-${ci}-${k}`, { opacity: 0.22 }, { opacity: 1, duration: 0.12, ease: "none" }, s));
      });

      // ---------- hook ----------
      [["#q1", -4, at("Cuántos")], ["#q2", 3, at("Quién")], ["#q3", -2, at("Y")]].forEach(([q, r, t], i) => {
        tl.fromTo(q, { opacity: 0, scale: 0.75, rotation: 0 }, { opacity: 1, scale: 1, rotation: r, duration: 0.5, ease: "back.out(1.8)" }, t);
        tl.fromTo(`${q} .q-card`, { x: 0 }, { x: 12, duration: 0.06, ease: "none", repeat: 7, yoyo: true }, at("caos") + i * 0.03);
        tl.to(q, { opacity: 0, y: 260, rotation: r * 4, duration: 0.45, ease: "power2.in", immediateRender: false }, 9.0 + i * 0.05);
      });
      tl.fromTo("#caos", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, at("caos"));
      tl.to("#caos", { opacity: 0, duration: 0.35, immediateRender: false }, 9.0);

      // ---------- phone, screens, taps, highlights ----------
      const screen = document.getElementById("screen");
      const SCREENS = ["a1-portada", "a2-ceremonia", "a3-vestimenta", "a4-confirma", "b1-form", "b2-nombre", "b3-personas", "b4-mensaje",
        "c1-panel", "c2-filtro-pendientes", "c3-busqueda", "d1-mesas", "d2-nueva-mesa", "d3-mesa-creada", "d4-sin-mesa",
        "d5-alexis-seleccionado", "d6-tocar-mesa", "d7-sentado", "d8-cupo", "d9-sin-mesa-despues", "e1-qr", "e2-escaneo"];
      SCREENS.forEach((n) => el("img", { id: "sc-" + n, src: `assets/screens/${n}.png`, alt: n }, screen));
      const scanline = el("div", { id: "scanline" }, screen);
      const W = 470, H = 1017;
      const show = (n, t, d = 0.35) =>
        tl.fromTo("#sc-" + n, { opacity: 0 }, { opacity: 1, duration: d, ease: "power1.inOut" }, t);
      let tapN = 0;
      const tap = (fx, fy, t) => {
        const id = "tap-" + tapN++;
        el("div", { className: "tap", id, style: `left:${fx * W}px;top:${fy * H}px` }, screen);
        tl.fromTo("#" + id, { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, t);
        tl.to("#" + id, { opacity: 0, scale: 1.8, duration: 0.45, ease: "power1.out" }, t + 0.25);
      };
      let hlN = 0;
      const hl = (fx, fy, fw, fh, t, until) => {
        const id = "hl-" + hlN++;
        el("div", { className: "hl", id, style: `left:${(fx - fw / 2) * W}px;top:${(fy - fh / 2) * H}px;width:${fw * W}px;height:${fh * H}px` }, screen);
        tl.fromTo("#" + id, { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.25 }, until);
      };

      // camera: bring screen point (fx, fy) to canvas point T at zoom k
      const O = { x: 540, y: 960 }, T = { x: 540, y: 1150 };
      let cam = { x: 0, y: 0, scale: 1 };
      tl.set("#cam", { x: 0, y: 0, scale: 1 }, 0);
      const focus = (fx, fy, k, t, d = 0.9) => {
        const P = { x: 305 + fx * W, y: 534 + fy * H };
        const to = { x: T.x - O.x - k * (P.x - O.x), y: T.y - O.y - k * (P.y - O.y), scale: k };
        tl.fromTo("#cam", { ...cam }, { ...to, duration: d, ease: "power3.inOut", immediateRender: false }, t);
        cam = to;
      };
      const wide = (t, d = 0.9) => {
        tl.fromTo("#cam", { ...cam }, { x: 0, y: 0, scale: 1, duration: d, ease: "power3.inOut", immediateRender: false }, t);
        cam = { x: 0, y: 0, scale: 1 };
      };

      // chips (canvas level, above the camera)
      const chips = document.getElementById("chips");
      const ICON_OK = '<svg viewBox="0 0 24 24" fill="none" stroke="#2f7d4f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
      const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="#b7791f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>';
      const ICON_CAL = '<svg viewBox="0 0 24 24" fill="none" stroke="#7a6657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
      const ICON_PEOPLE = '<svg viewBox="0 0 24 24" fill="none" stroke="#7a6657" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 19a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.6"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>';
      const dot = (c) => `<span class="dot" style="background:${c}"></span>`;
      let chipN = 0;
      const chip = (html, x, y, t, until) => {
        const id = "chip-" + chipN++;
        el("div", { className: "chip", id, innerHTML: html, style: `left:${x}px;top:${y}px` }, chips);
        tl.fromTo("#" + id, { opacity: 0, y: 30, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.8)" }, t);
        tl.to("#" + id, { opacity: 0, duration: 0.3 }, until);
      };

      // A — the invitation
      tl.fromTo("#phone", { opacity: 0, y: 260 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 9.5);
      tl.set("#sc-a1-portada", { opacity: 1 }, 0);
      focus(0.5, 0.3, 1.45, at("fotos") - 0.3, 1.2);
      show("a2-ceremonia", at("detalles") - 0.1);
      wide(at("detalles") - 0.1);
      show("a3-vestimenta", at("fiesta") + 0.4);

      // B — the guest confirms
      show("a4-confirma", at("botón") - 0.2);
      focus(0.5, 0.5, 1.9, at("botón") - 0.2);
      tap(0.5, 0.5, at("Confirma") + 0.15);
      show("b1-form", at("Escriben") - 0.3);
      focus(0.5, 0.466, 1.9, at("Escriben") - 0.3);
      show("b2-nombre", at("nombre") - 0.05, 0.6);
      focus(0.5, 0.353, 1.9, at("eligen") - 0.1);
      tap(0.84, 0.353, at("personas") - 0.1);
      show("b3-personas", at("personas") + 0.1, 0.2);
      focus(0.5, 0.6, 1.8, at("mensaje") - 0.2);
      show("b4-mensaje", at("vegetarianos") - 0.4, 0.6);
      focus(0.5, 0.866, 1.8, at("toque") - 0.1);
      tap(0.5, 0.866, at("Confirmar") + 0.3);
      chip(ICON_OK + "¡Asistencia confirmada!", 210, 1480, at("listo") - 0.1, at("Ahora") - 0.3);
      wide(at("Su"));

      // C — the couple's dashboard
      show("c1-panel", at("Ahora") - 0.1);
      focus(0.5, 0.2, 2.0, at("resumen") - 0.2);
      chip(ICON_PEOPLE + "12 personas", 90, 1440, at("total") - 0.3, at("filtras") - 0.3);
      chip(dot("#2f7d4f") + "6 confirmados", 560, 1440, at("confirmaron", 2) - 0.2, at("filtras") - 0.3);
      chip(dot("#d29a2c") + "4 pendientes", 90, 1560, at("pendientes") - 0.2, at("filtras") - 0.3);
      chip(dot("#c0504d") + "2 cancelaron", 560, 1560, at("cancelaron") - 0.2, at("filtras") - 0.3);
      focus(0.5, 0.29, 2.0, at("filtras") - 0.2);
      tap(0.757, 0.257, at("pendientes", 2) - 0.25);
      show("c2-filtro-pendientes", at("pendientes", 2));
      focus(0.5, 0.74, 1.5, at("escribirles") - 0.2);
      show("c3-busqueda", at("buscar") - 0.2);
      focus(0.5, 0.41, 2.0, at("buscar") - 0.2);
      hl(0.5, 0.41, 0.84, 0.065, at("nombre", 2) - 0.3, at("leer") - 0.2);
      focus(0.5, 0.79, 1.9, at("leer") - 0.1);
      hl(0.42, 0.818, 0.66, 0.07, at("mensajes") - 0.1, at("Cuando") - 0.3);

      // D — tables
      show("d1-mesas", at("Cuando") - 0.1);
      wide(at("Cuando") - 0.1);
      focus(0.62, 0.26, 1.8, at("Creas") - 0.3);
      tap(0.67, 0.26, at("Creas") + 0.2);
      show("d2-nueva-mesa", at("Creas") + 0.5);
      focus(0.5, 0.47, 1.6, at("Creas") + 0.5);
      hl(0.5, 0.434, 0.78, 0.055, at("nombre", 3) - 0.2, at("puestos") - 0.2);
      hl(0.5, 0.548, 0.78, 0.055, at("puestos") - 0.1, at("tiene") + 0.3);
      tap(0.5, 0.65, at("tiene") + 0.2);
      show("d3-mesa-creada", at("tiene") + 0.55);
      focus(0.5, 0.73, 1.6, at("tiene") + 0.55);
      hl(0.5, 0.73, 0.94, 0.11, at("tiene") + 0.9, at("sentar", 2) - 0.3);
      show("d4-sin-mesa", at("sentar", 2) - 0.1);
      focus(0.5, 0.66, 1.8, at("sentar", 2) - 0.1);
      tap(0.4, 0.67, at("invitado", 2));
      show("d5-alexis-seleccionado", at("invitado", 2) + 0.25, 0.2);
      show("d6-tocar-mesa", at("después") - 0.3);
      focus(0.5, 0.92, 1.6, at("después") - 0.3);
      tap(0.5, 0.975, at("mesa", 2) - 0.1);
      show("d7-sentado", at("Así") - 0.2);
      focus(0.5, 0.83, 1.8, at("Así") - 0.2);
      hl(0.5, 0.83, 0.94, 0.13, at("Así"), at("cupo") - 0.4);
      chip(ICON_OK + "Mesa 4 · 1 de 8 puestos", 170, 1480, at("ocupados") - 0.2, at("cupo") - 0.4);
      show("d8-cupo", at("pasas") - 0.2);
      focus(0.5, 0.47, 1.9, at("pasas") - 0.2);
      chip(ICON_WARN + "Te avisa si te pasas del cupo", 110, 1480, at("avisa") - 0.3, at("siempre") - 0.3);
      show("d9-sin-mesa-despues", at("siempre") - 0.1);
      focus(0.5, 0.64, 1.7, at("siempre") - 0.1);
      hl(0.5, 0.73, 0.94, 0.075, at("tiene", 2) - 0.2, at("dos") - 0.3);

      // E — QR ticket
      show("e1-qr", at("dos") - 0.2);
      wide(at("dos") - 0.2);
      chip(ICON_CAL + "2 días antes del evento", 175, 1480, at("dos"), at("entrada") - 0.3);
      focus(0.5, 0.46, 1.6, at("QR") - 0.6);
      tl.fromTo("#scanline", { opacity: 0, y: 0 }, { opacity: 1, y: 0, duration: 0.15 }, at("escanean") - 0.2);
      tl.fromTo("#scanline", { y: 0 }, { y: 290, duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true, immediateRender: false }, at("escanean") - 0.05);
      tl.to("#scanline", { opacity: 0, duration: 0.15 }, at("ven") - 0.2);
      show("e2-escaneo", at("ven") - 0.1);
      focus(0.5, 0.5, 1.6, at("ven") - 0.1);
      chip(ICON_OK + "Sofía & Mateo · 2 personas", 160, 1480, at("llega"), 120.4);

      // ---------- close ----------
      tl.fromTo("#close-panel", { yPercent: 100 }, { yPercent: 0, duration: 0.6, ease: "expo.inOut" }, 120.6);
      const tBrand = at("InvitApp", 3);
      tl.fromTo("#c-kicker", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, tBrand - 0.1);
      tl.fromTo("#c-brand", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.8, ease: "expo.out" }, tBrand);
      tl.fromTo("#c-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, tBrand + 0.4);
      const tag = document.getElementById("c-tag");
      const closeWords = WORDS.slice(closeIdx + 1);
      const ctaIdx = closeWords.findIndex((w) => clean(w[0]) === "Escríbenos");
      closeWords.slice(0, ctaIdx).forEach(([t, s], k) => {
        el("span", { className: "w", id: "tag-" + k, textContent: t }, tag);
        tl.fromTo("#tag-" + k, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, s - 0.05);
      });
      tl.fromTo("#c-cta", { opacity: 0, y: 24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.6)" }, at("Escríbenos") - 0.1);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
