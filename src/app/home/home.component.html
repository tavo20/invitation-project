<app-showcase *ngIf="showShowcase"></app-showcase>

<div *ngIf="templatesAvailable[templateComponent]">
    <ng-container
        [ngComponentOutlet]="templatesAvailable[templateComponent]"
        [ngComponentOutletInputs]="{ invitationData: dataInvitation?.data, confirmation: dataInvitation?.confirmation }"
    ></ng-container>
</div>

<div *ngIf="noDataFound">
    <p>No se encontró la invitación</p>
</div>
