<ng-container *ngIf="src">
  <button
    type="button"
    class="music-player"
    [class.is-playing]="isPlaying"
    [style.background]="background"
    [style.color]="color"
    (click)="toggle()"
    [attr.aria-label]="isPlaying ? 'Pausar música' : 'Reproducir música'"
    [attr.aria-pressed]="isPlaying">
    <!-- nota musical en pausa -->
    <svg *ngIf="!isPlaying" class="music-player__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-1.8V16" />
      <circle cx="6.5" cy="18" r="2.5" />
      <circle cx="16.5" cy="16" r="2.5" />
    </svg>
    <!-- barras animadas mientras suena -->
    <span *ngIf="isPlaying" class="music-player__bars" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </span>
  </button>

  <audio #audio [src]="src" loop preload="none" (play)="onPlay()" (pause)="onPause()"></audio>
</ng-container>
